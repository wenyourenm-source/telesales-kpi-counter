<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>テレアポKPIカウンター</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="KPIカウンター" />
<meta name="theme-color" content="#e6b055" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --bg: #f4f4f5;
    --tile-bg: #ffffff;
    --tile-border: #e2e2e5;
    --label-bg: #f3cf8f;
    --label-fg: #3b2f1e;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --accent: #2f6fed;
    --danger: #e0533d;
    --footer-bg: #e9e9ec;
    --radius: 14px;
    --tile-shadow: none;
    --font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Yu Gothic", Meiryo, system-ui, sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font-family);
    overscroll-behavior-y: contain;
    user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }

  header {
    padding: calc(10px + var(--safe-top)) 14px 8px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .industry-row { display: flex; align-items: center; gap: 8px; }
  .industry-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  select#industrySelect {
    flex: 1; font-size: 17px; font-weight: 600; padding: 10px 12px;
    border-radius: var(--radius); border: 1px solid var(--tile-border);
    background: var(--tile-bg); color: var(--text); appearance: none;
  }
  .theme-btn {
    flex-shrink: 0; width: 40px; height: 40px; padding: 0; font-size: 18px;
    border-radius: var(--radius); border: 1px solid var(--tile-border);
    background: var(--tile-bg); display: flex; align-items: center; justify-content: center;
  }
  .theme-btn:active { transform: scale(0.94); }
  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 8px;
  }
  .total-row .label { font-size: 13px; color: var(--muted); }
  .total-row .value { font-size: 15px; font-weight: 700; color: var(--muted); }

  /* ---- 称号・レベル（累計コール数）---- */
  /* カテゴリごとの配色。rank-card・称号一覧・レベルアップ演出すべてで共通利用する（軽量化のため使い回す）。 */
  .cat-gray    { --catbg: linear-gradient(135deg,#d9d9dd,#aaadb3); --cattext:#2b2b2e; --catglow: rgba(170,170,180,.45); }
  .cat-bronze  { --catbg: linear-gradient(135deg,#e7b480,#a9682f); --cattext:#3a2110; --catglow: rgba(185,120,50,.5); }
  .cat-silver  { --catbg: linear-gradient(135deg,#f4f4f7,#c2c5cc); --cattext:#2b2b2e; --catglow: rgba(200,205,215,.55); }
  .cat-blue    { --catbg: linear-gradient(135deg,#bfe9ff,#2f9bff); --cattext:#06304a; --catglow: rgba(60,160,255,.55); }
  .cat-purple  { --catbg: linear-gradient(135deg,#e6d6ff,#8a4dff); --cattext:#2a125e; --catglow: rgba(150,80,255,.55); }
  .cat-red     { --catbg: linear-gradient(135deg,#ff8a6a,#c0291f); --cattext:#fff; --catglow: rgba(255,70,40,.55); }
  .cat-gold    { --catbg: linear-gradient(135deg,#fff3c4,#e0a716,#9c6a0a); --cattext:#3d2600; --catglow: rgba(255,195,50,.6); }
  .cat-aurora  { --catbg: linear-gradient(120deg,#8affc1,#7fd7ff,#caa8ff); --cattext:#123; --catglow: rgba(140,220,255,.6); }
  .cat-rainbow { --catbg: linear-gradient(90deg,#ff5b5b,#ffd45b,#7bff5b,#5bdcff,#9d6bff,#ff5bd6); --cattext:#fff; --catglow: rgba(255,255,255,.65); }

  .rank-card {
    margin-top: 8px; padding: 8px 12px; border-radius: var(--radius); cursor: pointer;
    background: var(--catbg, var(--tile-bg)); border: 1px solid var(--tile-border);
    box-shadow: var(--tile-shadow), 0 0 14px var(--catglow, transparent);
    transition: background 0.3s ease;
  }
  .rank-card:active { transform: scale(0.98); }
  .rank-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rank-name { font-size: 14px; font-weight: 800; color: var(--cattext, var(--text)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-total { font-size: 11.5px; color: var(--cattext, var(--muted)); opacity: 0.8; white-space: nowrap; }
  .rank-bar-track {
    margin-top: 6px; height: 7px; border-radius: 999px; overflow: hidden;
    background: rgba(128,128,128,0.25);
  }
  .rank-bar-fill {
    height: 100%; border-radius: 999px; width: 0%;
    background: var(--cattext, var(--accent)); opacity: 0.85; transition: width 0.4s ease;
  }
  .rank-remain { margin-top: 4px; font-size: 11px; color: var(--cattext, var(--muted)); opacity: 0.8; }

  /* ---- 称号一覧（タップで開く） ---- */
  .title-overlay-card { max-height: 78vh; overflow-y: auto; }
  .title-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
  .title-row {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-radius: 12px; border: 2px solid transparent;
  }
  .title-row.locked { background: var(--footer-bg); opacity: 0.6; }
  .title-row.achieved { background: var(--catbg); color: var(--cattext); }
  .title-row.achieved.equipped { border-color: var(--accent); }
  .title-row .tr-level { font-size: 10.5px; font-weight: 800; opacity: 0.8; white-space: nowrap; flex-shrink: 0; }
  .title-row .tr-name {
    font-size: 13.5px; font-weight: 800; flex: 1; margin: 0 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: inherit;
  }
  .title-row .tr-threshold { font-size: 10px; opacity: 0.75; white-space: nowrap; flex-shrink: 0; }
  .title-row .tr-equipped-mark { font-size: 10px; font-weight: 800; flex-shrink: 0; color: var(--accent); }

  /* ---- レベルアップ演出 ---- */
  .levelup-frame {
    position: fixed; inset: 0; pointer-events: none; z-index: 150; opacity: 0;
    transition: opacity 0.2s ease;
  }
  .levelup-frame.show {
    opacity: 1;
    box-shadow: inset 0 0 0 9px var(--catglow, rgba(255,255,255,0.4)), inset 0 0 150px var(--catglow, rgba(255,255,255,0.3));
    animation: levelup-pulse 3s ease-in-out;
  }
  @keyframes levelup-pulse {
    0%, 100% { filter: brightness(1); }
    20% { filter: brightness(1.5); }
    50% { filter: brightness(1.15); }
    70% { filter: brightness(1.4); }
  }
  .levelup-toast {
    position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(0.35) rotate(-8deg);
    z-index: 151; pointer-events: none; text-align: center;
    padding: 18px 28px; border-radius: 18px; font-weight: 800;
    opacity: 0; transition: opacity 0.25s ease, transform 0.55s cubic-bezier(.34,1.56,.64,1);
    background: var(--catbg, #222); color: var(--cattext, #fff);
    box-shadow: 0 12px 36px var(--catglow, rgba(0,0,0,0.4)), 0 0 0 2px rgba(255,255,255,0.25);
  }
  .levelup-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  .levelup-toast .lu-label { display: block; font-size: 12px; font-weight: 700; opacity: 0.85; margin-bottom: 2px; letter-spacing: 1px; }
  .levelup-toast .lu-level { display: block; font-size: 11px; font-weight: 700; opacity: 0.75; margin-bottom: 4px; }
  .levelup-toast .lu-name { display: block; font-size: 22px; }
  .levelup-toast.show.cat-aurora .lu-name, .levelup-toast.show.cat-rainbow .lu-name {
    background-image: var(--catbg); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: cat-shimmer 1.4s linear infinite;
  }
  @keyframes cat-shimmer { to { background-position: 300% 0; } }

  main {
    flex: 1; overflow-y: auto; padding: 6px 10px 10px;
    -webkit-overflow-scrolling: touch;
  }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .tile {
    background: var(--tile-bg); border: 1px solid var(--tile-border);
    border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
    min-height: 92px; justify-content: space-between; box-shadow: var(--tile-shadow);
    transition: transform 0.06s ease, background 0.1s ease;
  }
  .tile.active-sub { box-shadow: inset 0 0 0 2px var(--danger); }
  .tile:active { transform: scale(0.96); background: #fafafa; }
  .tile .count {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
  }
  .tile .metric-label {
    background: var(--label-bg); color: var(--label-fg);
    font-size: 12.5px; font-weight: 600; text-align: center;
    padding: 6px 4px; line-height: 1.25;
  }

  footer {
    flex-shrink: 0; padding: 8px 14px calc(10px + var(--safe-bottom));
    background: var(--footer-bg); border-top: 1px solid var(--tile-border);
  }
  .mode-toggle {
    display: flex; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--tile-border);
    background: var(--tile-bg); margin-bottom: 6px;
  }
  .mode-toggle button {
    flex: 1; border: none; background: transparent; padding: 14px 0;
    font-size: 20px; font-weight: 700; color: var(--text);
  }
  .mode-toggle button.selected.minus { background: var(--danger); color: #fff; }
  .mode-toggle button.selected.plus { background: var(--accent); color: #fff; }
  .mode-toggle button.selected.edit { background: var(--label-bg); color: var(--label-fg); }
  .status-row {
    display: flex; justify-content: center; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #8bc48b;
  }
  .status-dot.pending { background: #e0a23d; }
  .status-dot.offline { background: var(--danger); }

  .overlay {
    position: fixed; inset: 0; background: rgba(20,20,22,0.55);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
  }
  .overlay .card {
    background: var(--tile-bg); border-radius: var(--radius); padding: 24px 20px; width: 100%; max-width: 360px;
  }
  .overlay h2 { font-size: 17px; margin: 0 0 6px; }
  .overlay p { font-size: 13px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
  .overlay input {
    width: 100%; font-size: 17px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--tile-border); margin-bottom: 12px;
  }
  .overlay button.primary {
    width: 100%; font-size: 16px; font-weight: 700; padding: 13px 0;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
  }
  .overlay .error { color: var(--danger); font-size: 12.5px; margin: -6px 0 10px; }
  .hidden { display: none !important; }

  .config-warning {
    background: #fdece7; color: #a33; font-size: 11.5px; text-align: center;
    padding: 6px 10px; border-radius: 10px; margin: 0 14px 6px;
  }

  /* ---- テーマ選択 ---- */
  .theme-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 50vh; overflow-y: auto; }
  .theme-option {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 12px; border: 2px solid var(--tile-border); background: var(--tile-bg);
    font-size: 14px; font-weight: 700; color: var(--text); text-align: left; width: 100%;
  }
  .theme-option.selected { border-color: var(--accent); }
  .theme-swatch {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.15); position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: flex-end; padding: 3px;
  }
  .theme-swatch-dot { width: 9px; height: 9px; border-radius: 50%; display: block; border: 1px solid rgba(0,0,0,0.15); }

  /* ---- レア演出（コール数タップ時、低確率）---- */
  .rare-frame {
    position: fixed; inset: 0; pointer-events: none; z-index: 150; opacity: 0;
    transition: opacity 0.15s ease;
  }
  .rare-frame.show { opacity: 1; }
  .rare-frame.blue { box-shadow: inset 0 0 0 6px rgba(70,140,255,0.55), inset 0 0 90px rgba(70,140,255,0.35); animation: rare-pulse-blue 2.3s ease-in-out; }
  .rare-frame.red { box-shadow: inset 0 0 0 7px rgba(255,60,60,0.6), inset 0 0 110px rgba(255,40,40,0.4); animation: rare-pulse-red 2.3s ease-in-out; }
  .rare-frame.gold { box-shadow: inset 0 0 0 8px rgba(255,200,60,0.7), inset 0 0 130px rgba(255,190,50,0.45); animation: rare-pulse-gold 2.3s ease-in-out; }
  .rare-frame.rainbow {
    box-shadow: inset 0 0 0 9px rgba(255,255,255,0.4), inset 0 0 150px rgba(255,255,255,0.25);
    background: conic-gradient(from 0deg, #ff5b5b, #ffd45b, #7bff5b, #5bdcff, #9d6bff, #ff5bd6, #ff5b5b);
    mix-blend-mode: overlay; animation: rare-pulse-rainbow 2.3s linear;
  }
  @keyframes rare-pulse-blue {
    0%, 100% { box-shadow: inset 0 0 0 3px rgba(70,140,255,0.3), inset 0 0 40px rgba(70,140,255,0.18); }
    50% { box-shadow: inset 0 0 0 7px rgba(70,140,255,0.65), inset 0 0 90px rgba(70,140,255,0.4); }
  }
  @keyframes rare-pulse-red {
    0%, 100% { box-shadow: inset 0 0 0 4px rgba(255,60,60,0.35), inset 0 0 50px rgba(255,40,40,0.22); }
    50% { box-shadow: inset 0 0 0 9px rgba(255,60,60,0.7), inset 0 0 110px rgba(255,40,40,0.45); }
  }
  @keyframes rare-pulse-gold {
    0%, 100% { box-shadow: inset 0 0 0 5px rgba(255,200,60,0.4), inset 0 0 60px rgba(255,190,50,0.25); }
    50% { box-shadow: inset 0 0 0 10px rgba(255,200,60,0.8), inset 0 0 140px rgba(255,190,50,0.5); }
  }
  @keyframes rare-pulse-rainbow {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .rare-toast {
    position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(0.4) rotate(-6deg);
    z-index: 151; pointer-events: none; text-align: center; white-space: nowrap;
    padding: 14px 24px; border-radius: 16px; font-weight: 800;
    opacity: 0; transition: opacity 0.2s ease, transform 0.45s cubic-bezier(.34,1.56,.64,1);
  }
  .rare-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  .rare-toast.blue { background: #eaf2ff; color: #1557c0; font-size: 18px; box-shadow: 0 8px 24px rgba(40,100,255,0.35); }
  .rare-toast.red { background: #fff0ee; color: #c3281c; font-size: 20px; box-shadow: 0 8px 28px rgba(255,40,40,0.4); }
  .rare-toast.gold {
    background: linear-gradient(135deg, #fff7df, #ffe6a6); color: #7a5a12; font-size: 21px;
    box-shadow: 0 10px 34px rgba(255,190,50,0.5); border: 1px solid #e9c466;
  }
  .rare-toast.rainbow {
    background: #111; font-size: 23px; letter-spacing: 0.5px;
    box-shadow: 0 0 0 3px #fff, 0 10px 40px rgba(0,0,0,0.5);
    background-image: linear-gradient(90deg, #ff5b5b, #ffd45b, #7bff5b, #5bdcff, #9d6bff, #ff5bd6, #ff5b5b);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rare-rainbow-text 1.6s linear infinite;
  }
  @keyframes rare-rainbow-text { to { background-position: 300% 0; } }

  /* ---- 演出共通パーツ（衝撃波リング・飛散パーティクル）----
     transform/opacityのみで動かす軽量な構成。レア演出・レベルアップ演出の両方から使い回す。 */
  .fx-ring {
    position: fixed; left: 50%; top: 30%; width: 160px; height: 160px; margin: -80px 0 0 -80px;
    border-radius: 50%; border-width: 4px; border-style: solid;
    pointer-events: none; z-index: 149; opacity: 0.9;
    animation: fx-ring-expand 0.85s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes fx-ring-expand {
    to { transform: scale(2.4); opacity: 0; }
  }
  .fx-spark {
    position: fixed; left: 50%; top: 30%; pointer-events: none; z-index: 152;
    opacity: 1; will-change: transform, opacity;
    animation: fx-spark-burst 0.95s cubic-bezier(.2,.65,.3,1) forwards;
  }
  @keyframes fx-spark-burst {
    to { transform: translate(var(--fx-dx), var(--fx-dy)) scale(0.3) rotate(var(--fx-rot)); opacity: 0; }
  }

  /* ---- アポ獲得の祝賀演出 ---- */
  .confetti-piece {
    position: fixed; top: -24px; pointer-events: none; z-index: 200;
    animation: confetti-fall 1.1s ease-in forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(380deg); opacity: 0; }
  }
  .celebrate-toast {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(0.3) rotate(-6deg);
    background: linear-gradient(135deg, #fff3c4, #ffcd46, #caa14b); color: #5a3d02;
    padding: 16px 26px; border-radius: 18px;
    font-size: 19px; font-weight: 800; box-shadow: 0 10px 34px rgba(255,190,50,0.45), 0 0 0 2px rgba(255,255,255,0.4);
    z-index: 201; opacity: 0; transition: opacity 0.2s ease, transform 0.5s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none; text-align: center; white-space: nowrap;
  }
  .celebrate-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }

  /* ---- おみくじ ---- */
  .omikuji-rank {
    font-size: 34px; font-weight: 800; text-align: center; margin: 0 0 12px;
    display: block; animation: omikuji-pop 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  .omikuji-rank.cat-gray, .omikuji-rank.cat-silver, .omikuji-rank.cat-blue,
  .omikuji-rank.cat-purple, .omikuji-rank.cat-gold {
    background: var(--catbg); color: var(--cattext); border-radius: 16px; padding: 10px 0;
    box-shadow: 0 10px 28px var(--catglow, rgba(0,0,0,0.25));
  }
  @keyframes omikuji-pop {
    0% { transform: scale(0.3) rotate(-12deg); opacity: 0; }
    60% { transform: scale(1.12) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .omikuji-message { text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="industry-row">
      <label for="industrySelect">架電業種</label>
      <select id="industrySelect"></select>
      <button type="button" id="themeBtn" class="theme-btn" aria-label="デザイン変更">🎨</button>
    </div>
    <div class="total-row">
      <span class="label" id="userLabel">&nbsp;</span>
      <span class="value" id="dateLabel">&nbsp;</span>
    </div>
    <div class="rank-card" id="rankCard">
      <div class="rank-card-top">
        <span class="rank-name" id="rankName">―</span>
        <span class="rank-total" id="rankTotal"></span>
      </div>
      <div class="rank-bar-track"><div class="rank-bar-fill" id="rankBarFill"></div></div>
      <div class="rank-remain" id="rankRemain"></div>
    </div>
  </header>

  <div id="configWarning" class="config-warning hidden">
    Apps ScriptのURLが未設定です。config.js を編集してください（ローカルのカウントは可能です）。
  </div>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="mode-toggle">
      <button id="modeMinus" data-mode="subtract" class="minus">－ 取消</button>
      <button id="modePlus" data-mode="add" class="selected plus">＋ カウント</button>
      <button id="modeEdit" data-mode="edit" class="edit">✎ 編集</button>
    </div>
    <div class="status-row">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">同期済み</span>
    </div>
  </footer>
</div>

<div class="overlay" id="nameOverlay">
  <div class="card">
    <h2>はじめに、お名前を登録してください</h2>
    <p>同姓同名を避けるため、フルネームで入力してください。この端末に保存され、次回以降は入力不要です。</p>
    <div class="error hidden" id="nameError">お名前を入力してください</div>
    <input id="nameInput" type="text" placeholder="例：山田 太郎" autocomplete="name" />
    <button class="primary" id="nameSaveBtn">この内容で開始する</button>
  </div>
</div>

<div class="overlay hidden" id="themeOverlay">
  <div class="card">
    <h2>デザインを選ぶ</h2>

  // ---- 称号・レベル（累計コール数、アプリ運用開始からの全期間）----

    { levelLabel: "Lv.04", threshold: 1000, name: "架電戦士", category: "bronze" },
    { levelLabel: "Lv.05", threshold: 3000, name: "コールハンター", category: "bronze" },
    { levelLabel: "Lv.06", threshold: 5000, name: "架電職人", category: "silver" },
    { levelLabel: "Lv.07", threshold: 10000, name: "人間コールセンター", category: "blue" },
    { levelLabel: "Lv.08", threshold: 15000, name: "電話の申し子", category: "blue" },
    { levelLabel: "Lv.09", threshold: 20000, name: "CALL MASTER", category: "purple" },
    { levelLabel: "Lv.10", threshold: 30000, name: "架電の鬼", category: "red" },
    { levelLabel: "Lv.11", threshold: 40000, name: "電話界の支配者", category: "red" },
    { levelLabel: "Lv.12", threshold: 50000, name: "黄金の架電王", category: "gold" },
    { levelLabel: "Lv.13", threshold: 75000, name: "生きる伝説", category: "gold" },
    { levelLabel: "Lv.14", threshold: 100000, name: "架電神 ― GOD ―", category: "gold" },
    { levelLabel: "Lv.15", threshold: 150000, name: "神を超えし者", category: "aurora" },
    { levelLabel: "Lv.MAX", threshold: 200000, name: "重要無形架電文化財", category: "rainbow" }
  ];

  // ---- デザイン（テーマ）一覧。色・角丸・フォントをCSSカスタムプロパティとして適用する。 ----
  var BASE_FONT = '-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif';
  var MONO_FONT = "'Courier New', Courier, monospace";
  var HACKER_FONT = "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace";
  var THEMES = [
    { id: "standard", name: "STANDARD",
      vars: { "--bg": "#f4f4f5", "--tile-bg": "#ffffff", "--tile-border": "#e2e2e5", "--label-bg": "#f3cf8f", "--label-fg": "#3b2f1e", "--text": "#1c1c1e", "--muted": "#8a8a8e", "--accent": "#2f6fed", "--danger": "#e0533d", "--footer-bg": "#e9e9ec", "--radius": "14px", "--font-family": BASE_FONT, "--tile-shadow": "none" } },
    { id: "blackgold", name: "BLACK GOLD",
      vars: { "--bg": "#0d0b08", "--tile-bg": "#1a1611", "--tile-border": "#3a2f1a", "--label-bg": "linear-gradient(135deg,#caa14b,#8a6d2f)", "--label-fg": "#1a1310", "--text": "#f3e6c8", "--muted": "#9c8a63", "--accent": "#d4af37", "--danger": "#c0392b", "--footer-bg": "#120f0a", "--radius": "14px", "--font-family": BASE_FONT, "--tile-shadow": "0 0 0 1px #3a2f1a, 0 4px 14px rgba(212,175,55,0.18)" } },
    { id: "cyberneon", name: "CYBER NEON",
      vars: { "--bg": "#120a24", "--tile-bg": "#1c1033", "--tile-border": "#3a2466", "--label-bg": "linear-gradient(135deg,#2a1854,#3d2a7a)", "--label-fg": "#9fdcff", "--text": "#e7e3ff", "--muted": "#9d8fc9", "--accent": "#00e5ff", "--danger": "#ff3d7f", "--footer-bg": "#0d0720", "--radius": "16px", "--font-family": BASE_FONT, "--tile-shadow": "0 0 10px rgba(0,229,255,0.25), inset 0 0 0 1px #3a2466" } },
    { id: "retrogame", name: "RETRO GAME",
      vars: { "--bg": "#101010", "--tile-bg": "#1d1d1d", "--tile-border": "#f5c400", "--label-bg": "#f5c400", "--label-fg": "#101010", "--text": "#f5f5f5", "--muted": "#9a9a9a", "--accent": "#2ecbff", "--danger": "#ff2e4d", "--footer-bg": "#0a0a0a", "--radius": "2px", "--font-family": MONO_FONT, "--tile-shadow": "inset 0 0 0 2px #000" } },
    { id: "y2kpink", name: "Y2K PINK",
      vars: { "--bg": "linear-gradient(135deg,#ffe6f4,#f1e6ff)", "--tile-bg": "#ffffff", "--tile-border": "#ffc9e8", "--label-bg": "linear-gradient(135deg,#ffb3dd,#d9b3ff)", "--label-fg": "#5a2a52", "--text": "#4a2d49", "--muted": "#b48bb0", "--accent": "#ff6fb5", "--danger": "#ff4f81", "--footer-bg": "#ffeaf6", "--radius": "20px", "--font-family": BASE_FONT, "--tile-shadow": "0 4px 14px rgba(255,111,181,0.18)" } },
    { id: "hacker", name: "HACKER",
      vars: { "--bg": "#000000", "--tile-bg": "#060a06", "--tile-border": "#1f3d1f", "--label-bg": "#0a1a0a", "--label-fg": "#39ff6a", "--text": "#39ff6a", "--muted": "#1f7a3a", "--accent": "#39ff6a", "--danger": "#ff3b3b", "--footer-bg": "#000000", "--radius": "4px", "--font-family": HACKER_FONT, "--tile-shadow": "0 0 6px rgba(57,255,106,0.25), inset 0 0 0 1px #1f3d1f" } }
  ];

  // ---- おみくじ（1日1回・起動時に表示） ----
  var OMIKUJI = [
    { rank: "大吉", message: "今日は大型案件が舞い込むかも！積極的に攻めていこう。" },
    { rank: "大吉", message: "声のトーンが絶好調。アポが連発する予感。" },
    { rank: "中吉", message: "丁寧なヒアリングが実を結ぶ日。焦らずじっくり。" },
    { rank: "吉", message: "コツコツの積み重ねが後で効いてくる日。" },
    { rank: "吉", message: "笑顔で電話すれば、相手にもきっと伝わる。" },
    { rank: "小吉", message: "小さな成功を積み重ねよう。数をこなせば道は開ける。" },
    { rank: "末吉", message: "今日は準備の日。次に繋がるヒントが見つかるかも。" }
  ];

  var FLUSH_DEBOUNCE_MS = 400;
  var FLUSH_RETRY_MS = 6000;
  var BATCH_SIZE = 40;

  // ---- 日本時間ヘルパー ----
  var jstDateFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" });
  var jstHourFmt = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", hour12: false });

  function jstDateString(d) {
    // sv-SE ロケールは "yyyy-mm-dd" 形式を返すため採用
    return jstDateFmt.format(d || new Date());
  }
  function jstHour(d) {
    var s = jstHourFmt.format(d || new Date()).replace(/[^0-9]/g, "");
    var h = parseInt(s, 10);
    if (isNaN(h)) h = new Date().getHours();
    return h % 24;
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0, v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function zeroCounts() {
    var o = {};
    METRICS.forEach(function (m) { o[m.key] = 0; });
    return o;
  }
  function emptyStacks() {
    var o = {};
    METRICS.forEach(function (m) { o[m.key] = []; });
    return o;
  }

  // 業種一覧。初回はキャッシュ（前回サーバーから取得した一覧）→無ければ初期セットの順で使う。
  // アプリ起動時にサーバーへ問い合わせて最新化する（fetchIndustries）。
  var industries = loadJSON(LS.INDUSTRIES_CACHE, null) || DEFAULT_INDUSTRIES.slice();

  // ---- 状態 ----
  var state = {
    name: localStorage.getItem(LS.NAME) || "",
    industry: localStorage.getItem(LS.INDUSTRY) || industries[0],
    day: localStorage.getItem(LS.DAY) || jstDateString(),
    counts: loadJSON(LS.COUNTS, zeroCounts()),
    stacks: loadJSON(LS.STACKS, emptyStacks()),
    queue: loadJSON(LS.QUEUE, []),
    mode: "add",
    theme: localStorage.getItem(LS.THEME) || "standard",
    cumBase: parseInt(localStorage.getItem(LS.CUM_BASE), 10) || 0,
    cumDelta: parseInt(localStorage.getItem(LS.CUM_DELTA), 10) || 0,
    cumTierSeen: parseInt(localStorage.getItem(LS.CUM_TIER_SEEN), 10) || 0,
    equipIdx: localStorage.getItem(LS.CUM_EQUIP) !== null ? parseInt(localStorage.getItem(LS.CUM_EQUIP), 10) : -1
  };

  function persistCounters() {
    localStorage.setItem(LS.DAY, state.day);
    saveJSON(LS.COUNTS, state.counts);
    saveJSON(LS.STACKS, state.stacks);
    saveJSON(LS.QUEUE, state.queue);
  }

  function persistCumulative() {
    localStorage.setItem(LS.CUM_BASE, String(state.cumBase));
    localStorage.setItem(LS.CUM_DELTA, String(state.cumDelta));
    localStorage.setItem(LS.CUM_TIER_SEEN, String(state.cumTierSeen));
    localStorage.setItem(LS.CUM_EQUIP, String(state.equipIdx));
  }

  function ensureDayRollover() {
    var today = jstDateString();
    if (today !== state.day) {
      state.day = today;
      state.counts = zeroCounts();
      state.stacks = emptyStacks();
      persistCounters();
      renderAll();
    }
  }

  // ---- DOM ----
  var gridEl = document.getElementById("grid");
  var industrySelect = document.getElementById("industrySelect");
  var userLabel = document.getElementById("userLabel");
  var dateLabel = document.getElementById("dateLabel");
  var modeMinus = document.getElementById("modeMinus");
  var modePlus = document.getElementById("modePlus");
  var modeEdit = document.getElementById("modeEdit");
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");
  var nameOverlay = document.getElementById("nameOverlay");
  var nameInput = document.getElementById("nameInput");
  var nameSaveBtn = document.getElementById("nameSaveBtn");
  var nameError = document.getElementById("nameError");
  var configWarning = document.getElementById("configWarning");
  var themeBtn = document.getElementById("themeBtn");
  var themeOverlay = document.getElementById("themeOverlay");
  var themeList = document.getElementById("themeList");
  var themeCloseBtn = document.getElementById("themeCloseBtn");
  var omikujiOverlay = document.getElementById("omikujiOverlay");
  var omikujiRank = document.getElementById("omikujiRank");
  var omikujiMessage = document.getElementById("omikujiMessage");
  var omikujiCloseBtn = document.getElementById("omikujiCloseBtn");
  var rareFrame = document.getElementById("rareFrame");
  var rareToast = document.getElementById("rareToast");
  var rankCard = document.getElementById("rankCard");
  var rankName = document.getElementById("rankName");
  var rankTotal = document.getElementById("rankTotal");
  var rankBarFill = document.getElementById("rankBarFill");
  var rankRemain = document.getElementById("rankRemain");
  var titleOverlay = document.getElementById("titleOverlay");
  var titleList = document.getElementById("titleList");
  var titleCloseBtn = document.getElementById("titleCloseBtn");
  var levelupFrame = document.getElementById("levelupFrame");
  var levelupToast = document.getElementById("levelupToast");
  var levelupLevel = document.getElementById("levelupLevel");
  var levelupName = document.getElementById("levelupName");

  function buildIndustryOptions() {
    industrySelect.innerHTML = "";
    industries.forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      industrySelect.appendChild(opt);
    });
    if (industries.indexOf(state.industry) === -1) {
      state.industry = industries[0];
      localStorage.setItem(LS.INDUSTRY, state.industry);
    }
    industrySelect.value = state.industry;
  }

  /**
   * 業種一覧をサーバー（スプレッドシートの「設定」シート）から取得して最新化する。
   * 管理者がシートに業種を追加・削除するだけで、この端末にも反映される（コード変更・再デプロイ不要）。
   * 失敗時・オフライン時は前回キャッシュ（または初期セット）のまま動作する。
   */
  function fetchIndustries() {
    if (!endpointReady()) return;
    fetch(window.APPS_SCRIPT_URL + "?action=industries", { method: "GET" })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json && json.ok && Array.isArray(json.industries) && json.industries.length) {
          industries = json.industries;
          saveJSON(LS.INDUSTRIES_CACHE, industries);
          buildIndustryOptions();
        }
      })
      .catch(function () {});
  }

  function buildTiles() {
    gridEl.innerHTML = "";
    METRICS.forEach(function (m) {
      var tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.metric = m.key;
      tile.innerHTML =
        '<div class="count" id="count-' + m.key + '">0</div>' +
        '<div class="metric-label">' + m.label + "</div>";
      tile.addEventListener("click", function () { onTileTap(m.key); });
      gridEl.appendChild(tile);
    });
  }

  function renderCounts() {
    METRICS.forEach(function (m) {
      var el = document.getElementById("count-" + m.key);
      if (el) el.textContent = String(state.counts[m.key] || 0);
    });
  }

  function renderHeader() {
    userLabel.textContent = state.name ? state.name + " さん" : "";
    dateLabel.textContent = formatDateLabel(state.day);
  }

  function formatDateLabel(dateStr) {
    var parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    return parts[0] + "/" + parts[1] + "/" + parts[2] + " 本日累計";
  }

  function renderMode() {
    modePlus.classList.toggle("selected", state.mode === "add");
    modeMinus.classList.toggle("selected", state.mode === "subtract");
    modeEdit.classList.toggle("selected", state.mode === "edit");
  }

  function renderStatus() {
    var pending = state.queue.length;
    if (!navigator.onLine) {
      statusDot.className = "status-dot offline";
      statusText.textContent = "オフライン（未送信 " + pending + " 件）";
    } else if (pending > 0) {
      statusDot.className = "status-dot pending";
      statusText.textContent = "送信中…（未送信 " + pending + " 件）";
    } else {
      statusDot.className = "status-dot";
      statusText.textContent = "同期済み";
    }
  }

  function renderAll() {
    renderHeader();
    renderCounts();
    renderMode();
    renderStatus();
    renderRank();
  }

  /**
   * 1回分の加算/減算を実際に適用する（スタック操作・イベントキュー追加まで）。
   * 通常のタップ（1回）にも、編集モードの一括変更（複数回ループ）にも共通で使う。
   * 呼び出し側で persistCounters/renderCounts/renderStatus/scheduleFlush をまとめて呼ぶこと。
   */
  function applyStep(metricKey, stepDelta, nowIso) {
    if (stepDelta > 0) {
      state.counts[metricKey] = (state.counts[metricKey] || 0) + 1;
      var ctx = { industry: state.industry, occurredAt: nowIso };
      state.stacks[metricKey].push(ctx);
      enqueueEvent({
        clientEventId: uuid(),
        name: state.name,
        industry: ctx.industry,
        metricKey: metricKey,
        delta: 1,
        occurredAt: ctx.occurredAt
      });
      if (metricKey === "call") bumpCumulative(1);
    } else {
      if ((state.counts[metricKey] || 0) <= 0) return; // 0未満にはしない
      var popped = state.stacks[metricKey].pop();
      var useIndustry = popped ? popped.industry : state.industry;
      var useOccurredAt = popped ? popped.occurredAt : nowIso;
      state.counts[metricKey] = Math.max(0, (state.counts[metricKey] || 0) - 1);
      enqueueEvent({
        clientEventId: uuid(),
        name: state.name,
        industry: useIndustry,
        metricKey: metricKey,
        delta: -1,
        occurredAt: useOccurredAt
      });
      if (metricKey === "call") bumpCumulative(-1);
    }
  }

  // ---- 称号・レベル（累計コール数）のロジック ----
  // 累計値 = サーバーから最後に取得できた確定値（cumBase）＋ その後ローカルで加減算した分（cumDelta）。
  // タップのたびにサーバーへ問い合わせる必要がないため、カウント操作そのものの速度には影響しない。
  function cumulativeTotal() {
    return Math.max(0, state.cumBase + state.cumDelta);
  }

  function tierForTotal(total) {
    var tier = TITLE_TIERS[0];
    for (var i = 0; i < TITLE_TIERS.length; i++) {
      if (total >= TITLE_TIERS[i].threshold) tier = TITLE_TIERS[i];
    }
    return tier;
  }

  function tierIndex(tier) {
    return TITLE_TIERS.indexOf(tier);
  }

  // 実際に到達済みの最高レベル（称号の解放状況の判定に使う。装着中の表示とは独立）。
  function achievedMaxIdx() {
    return tierIndex(tierForTotal(cumulativeTotal()));
  }

  // 画面バッジに表示するレベル。装着指定（equipIdx）が解放済み範囲内ならそれを優先し、
  // 未指定（-1）または範囲外の場合は常に「現在の最高到達レベル」を自動表示する。
  function displayTierIdx() {
    var maxIdx = achievedMaxIdx();
    if (state.equipIdx >= 0 && state.equipIdx <= maxIdx) return state.equipIdx;
    return maxIdx;
  }

  function bumpCumulative(delta) {
    var beforeIdx = achievedMaxIdx();
    state.cumDelta += delta;
    persistCumulative();
    renderRank();
    var afterIdx = achievedMaxIdx();
    if (afterIdx > Math.max(beforeIdx, state.cumTierSeen)) {
      state.cumTierSeen = afterIdx;
      persistCumulative();
      if (afterIdx > 0) triggerLevelUp(TITLE_TIERS[afterIdx]);
    }
  }

  function renderRank() {
    var total = cumulativeTotal();
    var maxIdx = achievedMaxIdx();
    var shownIdx = displayTierIdx();
    var shownTier = TITLE_TIERS[shownIdx];
    var next = TITLE_TIERS[maxIdx + 1];

    rankCard.className = "rank-card cat-" + shownTier.category;
    rankName.textContent = shownTier.levelLabel + " " + shownTier.name;
    rankTotal.textContent = "累計コール " + total.toLocaleString() + "件";

    if (next) {
      var prevThreshold = TITLE_TIERS[maxIdx].threshold;
      var span = next.threshold - prevThreshold;
      var progressed = total - prevThreshold;
      var pct = span > 0 ? Math.max(0, Math.min(100, (progressed / span) * 100)) : 100;
      rankBarFill.style.width = pct + "%";
      rankRemain.textContent = "次の称号「？？？」まであと " + (next.threshold - total).toLocaleString() + "件";
    } else {
      rankBarFill.style.width = "100%";
      rankRemain.textContent = "最高位の称号に到達しました";
    }
  }

  function renderTitleList() {
    var maxIdx = achievedMaxIdx();
    var shownIdx = displayTierIdx();
    titleList.innerHTML = "";
    TITLE_TIERS.forEach(function (tier, idx) {
      var achieved = idx <= maxIdx;
      var row = document.createElement("button");
      row.type = "button";
      row.className = "title-row " + (achieved ? "cat-" + tier.category + " achieved" : "locked") +
        (achieved && idx === shownIdx ? " equipped" : "");
      row.innerHTML =
        '<span class="tr-level">' + tier.levelLabel + '</span>' +
        '<span class="tr-name">' + (achieved ? tier.name : "？？？") + '</span>' +
        '<span class="tr-threshold">' + tier.threshold.toLocaleString() + '件' + (achieved ? '' : 'で解放') + '</span>' +
        (achieved && idx === shownIdx ? '<span class="tr-equipped-mark">装着中</span>' : '');
      if (achieved) {
        row.addEventListener("click", function () {
          state.equipIdx = idx;
          persistCumulative();
          renderRank();
          renderTitleList();
        });
      } else {
        row.disabled = true;
      }
      titleList.appendChild(row);
    });
  }

  // ---- 演出の豪華さ（衝撃波リング・飛散パーティクル）をカテゴリごとに定義 ----
  // transform/opacityのみで動くDOM要素を一瞬だけ生成し、終了後は確実に除去する（常駐コストゼロ）。
  var FX_CATEGORY_STYLE = {
    gray:    { color: "#aaadb3", emojis: ["✨", "⭐"], count: 10 },
    bronze:  { color: "#c9893f", emojis: ["✨", "⭐"], count: 12 },
    silver:  { color: "#c7ccd4", emojis: ["✨", "⭐", "💠"], count: 13 },
    blue:    { color: "#2f9bff", emojis: ["✨", "💠", "⭐"], count: 14 },
    purple:  { color: "#8a4dff", emojis: ["✨", "💠", "⭐"], count: 15 },
    red:     { color: "#ff4433", emojis: ["🔥", "✨", "⭐"], count: 16 },
    gold:    { color: "#ffc83c", emojis: ["⭐", "✨", "👑"], count: 18 },
    aurora:  { color: "#8affc1", emojis: ["✨", "💫", "🌟"], count: 20 },
    rainbow: { color: "#ffffff", emojis: ["🎉", "✨", "🌟", "👑", "💎"], count: 24 }
  };

  function spawnRing(color) {
    var ring = document.createElement("div");
    ring.className = "fx-ring";
    ring.style.borderColor = color;
    document.body.appendChild(ring);
    setTimeout(function () { ring.remove(); }, 900);
  }

  function spawnBurst(emojis, count) {
    for (var i = 0; i < count; i++) {
      var piece = document.createElement("span");
      piece.className = "fx-spark";
      piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      var angle = Math.random() * Math.PI * 2;
      var dist = 70 + Math.random() * 90;
      piece.style.setProperty("--fx-dx", (Math.cos(angle) * dist).toFixed(1) + "px");
      piece.style.setProperty("--fx-dy", (Math.sin(angle) * dist).toFixed(1) + "px");
      piece.style.setProperty("--fx-rot", Math.round(Math.random() * 360 - 180) + "deg");
      piece.style.fontSize = Math.round(16 + Math.random() * 14) + "px";
      piece.style.animationDelay = (Math.random() * 0.1).toFixed(2) + "s";
      document.body.appendChild(piece);
      (function (el) { setTimeout(function () { el.remove(); }, 1150); })(piece);
    }
  }

  function playGrandEffect(category) {
    var style = FX_CATEGORY_STYLE[category] || FX_CATEGORY_STYLE.gray;
    spawnRing(style.color);
    spawnBurst(style.emojis, style.count);
  }

  var levelupTimer = null;
  function triggerLevelUp(tier) {
    if (levelupTimer) {
      clearTimeout(levelupTimer);
      levelupFrame.className = "levelup-frame";
      levelupToast.className = "levelup-toast";
      void levelupFrame.offsetWidth;
    }
    levelupLevel.textContent = tier.levelLabel;
    levelupName.textContent = tier.name;
    levelupFrame.className = "levelup-frame cat-" + tier.category + " show";
    levelupToast.className = "levelup-toast cat-" + tier.category + " show";
    playGrandEffect(tier.category);
    levelupTimer = setTimeout(function () {
      levelupFrame.className = "levelup-frame";
      levelupToast.className = "levelup-toast";
      levelupTimer = null;
    }, 3000);
  }

  /**
   * 累計コール数をサーバー（累計KPIシート）から取得して基準値を更新する。
   * タップ操作ではなく、起動時・フォアグラウンド復帰時にだけ呼ぶ（fetchIndustriesと同じ頻度）。
   * 表示が後退しないよう、サーバー値とローカル確定値の大きい方を基準に据え直す。
   */
  function fetchMyStats() {
    if (!endpointReady() || !state.name) return;
    fetch(window.APPS_SCRIPT_URL + "?action=mystats&name=" + encodeURIComponent(state.name), { method: "GET" })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json || !json.ok || typeof json.totalCalls !== "number") return;
        var displayed = cumulativeTotal();
        var newBase = Math.max(json.totalCalls, displayed);
        state.cumDelta = newBase - json.totalCalls;
        state.cumBase = json.totalCalls;
        // 初回取得時など、既にこのタップより前に到達済みの称号は演出なしで静かに反映する
        var knownTier = tierIndex(tierForTotal(newBase));
        if (knownTier > state.cumTierSeen) state.cumTierSeen = knownTier;
        persistCumulative();
        renderRank();
      })
      .catch(function () {});
  }

  function onTileTap(metricKey) {
    ensureDayRollover();
    if (state.mode === "edit") { onTileEdit(metricKey); return; }

    var nowIso = new Date().toISOString();
    var wasAdd = state.mode === "add";
    applyStep(metricKey, wasAdd ? 1 : -1, nowIso);
    if (wasAdd && metricKey === "appo") celebrateAppo();
    if (wasAdd && metricKey === "call") rollRareEffect();

    persistCounters();
    renderCounts();
    renderStatus();
    scheduleFlush();
  }

  /**
   * 編集モード：タイルをタップすると現在の件数を元に新しい件数を入力できる。
   * 差分（増えた分/減った分）を1件ずつの加算・減算として処理するため、
   * 既存の業種・時間帯の紐づけ（取消時の正しい再帰属）やサーバー側の検証は一切変更不要。
   */
  function onTileEdit(metricKey) {
    var metric = null;
    for (var i = 0; i < METRICS.length; i++) {
      if (METRICS[i].key === metricKey) { metric = METRICS[i]; break; }
    }
    var label = metric ? metric.label : metricKey;
    var current = state.counts[metricKey] || 0;
    var input = window.prompt(label + "の本日の件数を入力してください（現在 " + current + " 件）", String(current));
    if (input === null) return; // キャンセル

    var trimmed = input.trim();
    if (!/^\d+$/.test(trimmed)) {
      window.alert("0以上の整数を入力してください");
      return;
    }
    var next = parseInt(trimmed, 10);
    if (next > 9999) {
      window.alert("9999件以下で入力してください");
      return;
    }

    var diff = next - current;
    if (diff === 0) return;

    var nowIso = new Date().toISOString();
    var steps = Math.abs(diff);
    var stepDelta = diff > 0 ? 1 : -1;
    for (var s = 0; s < steps; s++) {
      applyStep(metricKey, stepDelta, nowIso);
    }
    if (diff > 0 && metricKey === "appo") celebrateAppo();

    persistCounters();
    renderCounts();
    renderStatus();
    scheduleFlush();
  }

  function enqueueEvent(ev) {
    state.queue.push(ev);
  }

  // ---- デザイン（テーマ）----
  function applyTheme(themeId) {
    var theme = null;
    for (var i = 0; i < THEMES.length; i++) {
      if (THEMES[i].id === themeId) { theme = THEMES[i]; break; }
    }
    if (!theme) theme = THEMES[0];
    var root = document.documentElement.style;
    Object.keys(theme.vars).forEach(function (key) { root.setProperty(key, theme.vars[key]); });
    state.theme = theme.id;
    localStorage.setItem(LS.THEME, theme.id);
  }

  function buildThemeList() {
    themeList.innerHTML = "";
    THEMES.forEach(function (t) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "theme-option" + (state.theme === t.id ? " selected" : "");
      btn.innerHTML =
        '<span class="theme-swatch" style="background:' + t.vars["--bg"] + '">' +
          '<span class="theme-swatch-dot" style="background:' + t.vars["--accent"] + '"></span>' +
        '</span>' +
        '<span style="font-family:' + t.vars["--font-family"] + '">' + t.name + "</span>";
      btn.addEventListener("click", function () {
        applyTheme(t.id);
        buildThemeList();
      });
      themeList.appendChild(btn);
    });
  }

  // ---- アポ獲得時の祝賀演出 ----
  var CONFETTI_EMOJI = ["🎉", "✨", "🎊", "⭐", "🥳", "👏", "🏆"];
  var CELEBRATE_MESSAGES = ["🎉 アポ獲得！", "やった、ナイスアポ！", "お見事！🎉", "この調子！"];
  function celebrateAppo() {
    for (var i = 0; i < 20; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
      piece.style.left = (Math.random() * 100) + "vw";
      piece.style.fontSize = (16 + Math.random() * 16) + "px";
      piece.style.animationDelay = (Math.random() * 0.25) + "s";
      document.body.appendChild(piece);
      (function (el) { setTimeout(function () { el.remove(); }, 1500); })(piece);
    }
    spawnRing("#ffc83c");
    var toast = document.createElement("div");
    toast.className = "celebrate-toast";
    toast.textContent = CELEBRATE_MESSAGES[Math.floor(Math.random() * CELEBRATE_MESSAGES.length)];
    document.body.appendChild(toast);
    requestAnimationFrame(function () { toast.classList.add("show"); });
    setTimeout(function () {
      toast.classList.remove("show");
      setTimeout(function () { toast.remove(); }, 200);
    }, 1400);
  }

  // ---- コール数タップ時のレア演出（低確率。他の処理には一切影響しない） ----
  // 1回の抽選（0〜1の乱数）を、レアな順に区間へ振り分けることで、各演出の発生確率を
  // 正確に独立させつつ、同時発生が起きないようにしている。
  var RARE_TIERS = [
    { id: "rainbow", p: 1 / 10000, message: "PREMIUM!! 本日、無双の予感。" },
    { id: "gold", p: 1 / 2000, message: "前確の神、降臨。" },
    { id: "red", p: 1 / 777, message: "激アツ！アポ獲得の予感！" },
    { id: "blue", p: 1 / 400, message: "アポの気配…" }
  ];
  var rareTimer = null;
  function rollRareEffect() {
    var r = Math.random();
    var cum = 0;
    for (var i = 0; i < RARE_TIERS.length; i++) {
      cum += RARE_TIERS[i].p;
      if (r < cum) { showRareEffect(RARE_TIERS[i]); return; }
    }
  }
  function showRareEffect(tier) {
    if (rareTimer) {
      clearTimeout(rareTimer);
      rareFrame.className = "rare-frame";
      rareToast.className = "rare-toast";
      void rareFrame.offsetWidth; // 強制リフローで前回のアニメーションをリセット
    }
    rareToast.textContent = tier.message;
    rareFrame.className = "rare-frame " + tier.id + " show";
    rareToast.className = "rare-toast " + tier.id + " show";
    playGrandEffect(tier.id);
    rareTimer = setTimeout(function () {
      rareFrame.className = "rare-frame";
      rareToast.className = "rare-toast";
      rareTimer = null;
    }, 2300);
  }

  // ---- おみくじ（1日1回、アプリを開いたときに表示） ----
  var OMIKUJI_RANK_CATEGORY = { "大吉": "gold", "中吉": "purple", "吉": "blue", "小吉": "silver", "末吉": "gray" };
  function maybeShowOmikuji() {
    var today = jstDateString();
    if (localStorage.getItem(LS.OMIKUJI_DAY) === today) return;
    var pick = OMIKUJI[Math.floor(Math.random() * OMIKUJI.length)];
    var category = OMIKUJI_RANK_CATEGORY[pick.rank] || "gray";
    omikujiRank.textContent = pick.rank;
    omikujiRank.className = "omikuji-rank cat-" + category;
    omikujiMessage.textContent = pick.message;
    omikujiOverlay.classList.remove("hidden");
    localStorage.setItem(LS.OMIKUJI_DAY, today);
    playGrandEffect(category);
  }

  // ---- サーバー送信 ----
  var flushTimer = null;
  var flushing = false;

  function scheduleFlush() {
    if (flushTimer) clearTimeout(flushTimer);
    flushTimer = setTimeout(flushQueue, FLUSH_DEBOUNCE_MS);
  }

  function endpointReady() {
    return typeof window.APPS_SCRIPT_URL === "string" &&
      /^https?:\/\//.test(window.APPS_SCRIPT_URL) &&
      window.APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === -1;
  }

  function flushQueue() {
    configWarning.classList.toggle("hidden", endpointReady());
    if (flushing) return;
    if (!state.queue.length) { renderStatus(); return; }
    if (!endpointReady() || !navigator.onLine) {
      renderStatus();
      flushTimer = setTimeout(flushQueue, FLUSH_RETRY_MS);
      return;
    }

    flushing = true;
    var batch = state.queue.slice(0, BATCH_SIZE);
    renderStatus();

    fetch(window.APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // CORSプリフライト回避のため text/plain を使用
      body: JSON.stringify({ events: batch })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        flushing = false;
        if (json && json.ok) {
          var sentIds = {};
          batch.forEach(function (ev) { sentIds[ev.clientEventId] = true; });
          state.queue = state.queue.filter(function (ev) { return !sentIds[ev.clientEventId]; });
          persistCounters();
          renderStatus();
          if (state.queue.length) scheduleFlush();
        } else {
          flushTimer = setTimeout(flushQueue, FLUSH_RETRY_MS);
        }
      })
      .catch(function () {
        flushing = false;
        flushTimer = setTimeout(flushQueue, FLUSH_RETRY_MS);
      });
  }

  // ---- イベント ----
  industrySelect.addEventListener("change", function () {
    state.industry = industrySelect.value;
    localStorage.setItem(LS.INDUSTRY, state.industry);
  });

  modePlus.addEventListener("click", function () { state.mode = "add"; renderMode(); });
  modeMinus.addEventListener("click", function () { state.mode = "subtract"; renderMode(); });
  modeEdit.addEventListener("click", function () { state.mode = "edit"; renderMode(); });

  themeBtn.addEventListener("click", function () {
    buildThemeList();
    themeOverlay.classList.remove("hidden");
  });
  themeCloseBtn.addEventListener("click", function () { themeOverlay.classList.add("hidden"); });

  rankCard.addEventListener("click", function () {
    renderTitleList();
    titleOverlay.classList.remove("hidden");
  });
  titleCloseBtn.addEventListener("click", function () { titleOverlay.classList.add("hidden"); });
  omikujiCloseBtn.addEventListener("click", function () { omikujiOverlay.classList.add("hidden"); });

  window.addEventListener("online", function () { renderStatus(); scheduleFlush(); });
  window.addEventListener("offline", renderStatus);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      ensureDayRollover();
      scheduleFlush();
      fetchIndustries();
      fetchMyStats();
    }
  });
  setInterval(function () { ensureDayRollover(); scheduleFlush(); }, 15000);

  function saveName() {
    var v = nameInput.value.trim();
    if (!v) { nameError.classList.remove("hidden"); return; }
    nameError.classList.add("hidden");
    state.name = v;
    localStorage.setItem(LS.NAME, v);
    nameOverlay.classList.add("hidden");
    renderHeader();
    maybeShowOmikuji();
    fetchMyStats();
  }
  nameSaveBtn.addEventListener("click", saveName);
  nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") saveName(); });

  // ---- 初期化 ----
  function init() {
    applyTheme(state.theme);
    buildIndustryOptions();
    buildTiles();
    ensureDayRollover();
    renderAll();
    configWarning.classList.toggle("hidden", endpointReady());

    if (!state.name) {
      nameOverlay.classList.remove("hidden");
      setTimeout(function () { nameInput.focus(); }, 200);
    } else {
      nameOverlay.classList.add("hidden");
      maybeShowOmikuji();
    }

    if (state.queue.length) scheduleFlush();
    fetchIndustries();
    fetchMyStats();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  }

  init();
})();
</script>
</body>
