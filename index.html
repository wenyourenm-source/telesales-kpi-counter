<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>テレアポKPIカウンター</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="KPIカウンター" />
<meta name="theme-color" content="#e6b055" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --bg: #f4f4f5;
    --tile-bg: #ffffff;
    --tile-border: #e2e2e5;
    --label-bg: #f3cf8f;
    --label-fg: #3b2f1e;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --accent: #2f6fed;
    --danger: #e0533d;
    --footer-bg: #e9e9ec;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Yu Gothic", Meiryo, system-ui, sans-serif;
    overscroll-behavior-y: contain;
    user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }

  header {
    padding: calc(10px + var(--safe-top)) 14px 8px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .industry-row { display: flex; align-items: center; gap: 8px; }
  .industry-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  select#industrySelect {
    flex: 1; font-size: 17px; font-weight: 600; padding: 10px 12px;
    border-radius: 12px; border: 1px solid var(--tile-border);
    background: var(--tile-bg); color: var(--text); appearance: none;
  }
  .theme-btn {
    flex-shrink: 0; width: 40px; height: 40px; padding: 0; font-size: 18px;
    border-radius: 12px; border: 1px solid var(--tile-border);
    background: var(--tile-bg); display: flex; align-items: center; justify-content: center;
  }
  .theme-btn:active { transform: scale(0.94); }
  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 8px;
  }
  .total-row .label { font-size: 13px; color: var(--muted); }
  .total-row .value { font-size: 15px; font-weight: 700; color: var(--muted); }

  main {
    flex: 1; overflow-y: auto; padding: 6px 10px 10px;
    -webkit-overflow-scrolling: touch;
  }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .tile {
    background: var(--tile-bg); border: 1px solid var(--tile-border);
    border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
    min-height: 92px; justify-content: space-between;
    transition: transform 0.06s ease, background 0.1s ease;
  }
  .tile.active-sub { box-shadow: inset 0 0 0 2px var(--danger); }
  .tile:active { transform: scale(0.96); background: #fafafa; }
  .tile .count {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
  }
  .tile .metric-label {
    background: var(--label-bg); color: var(--label-fg);
    font-size: 12.5px; font-weight: 600; text-align: center;
    padding: 6px 4px; line-height: 1.25;
  }

  footer {
    flex-shrink: 0; padding: 8px 14px calc(10px + var(--safe-bottom));
    background: var(--footer-bg); border-top: 1px solid var(--tile-border);
  }
  .mode-toggle {
    display: flex; border-radius: 14px; overflow: hidden; border: 1px solid var(--tile-border);
    background: var(--tile-bg); margin-bottom: 6px;
  }
  .mode-toggle button {
    flex: 1; border: none; background: transparent; padding: 14px 0;
    font-size: 20px; font-weight: 700; color: var(--text);
  }
  .mode-toggle button.selected.minus { background: var(--danger); color: #fff; }
  .mode-toggle button.selected.plus { background: var(--accent); color: #fff; }
  .mode-toggle button.selected.edit { background: var(--label-bg); color: var(--label-fg); }
  .status-row {
    display: flex; justify-content: center; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #8bc48b;
  }
  .status-dot.pending { background: #e0a23d; }
  .status-dot.offline { background: var(--danger); }

  .overlay {
    position: fixed; inset: 0; background: rgba(20,20,22,0.55);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
  }
  .overlay .card {
    background: var(--tile-bg); border-radius: 18px; padding: 24px 20px; width: 100%; max-width: 360px;
  }
  .overlay h2 { font-size: 17px; margin: 0 0 6px; }
  .overlay p { font-size: 13px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
  .overlay input {
    width: 100%; font-size: 17px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--tile-border); margin-bottom: 12px;
  }
  .overlay button.primary {
    width: 100%; font-size: 16px; font-weight: 700; padding: 13px 0;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
  }
  .overlay .error { color: var(--danger); font-size: 12.5px; margin: -6px 0 10px; }
  .hidden { display: none !important; }

  .config-warning {
    background: #fdece7; color: #a33; font-size: 11.5px; text-align: center;
    padding: 6px 10px; border-radius: 10px; margin: 0 14px 6px;
  }

  /* ---- テーマ選択 ---- */
  .theme-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .theme-option {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 12px; border: 2px solid var(--tile-border); background: var(--tile-bg);
    font-size: 14px; font-weight: 600; color: var(--text); text-align: left; width: 100%;
  }
  .theme-option.selected { border-color: var(--accent); }
  .theme-swatch {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.12);
  }

  /* ---- アポ獲得の祝賀演出 ---- */
  .confetti-piece {
    position: fixed; top: -24px; pointer-events: none; z-index: 200;
    animation: confetti-fall 1.1s ease-in forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(380deg); opacity: 0; }
  }
  .celebrate-toast {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(0.8);
    background: var(--tile-bg); color: var(--text); padding: 14px 22px; border-radius: 16px;
    font-size: 18px; font-weight: 800; box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    z-index: 201; opacity: 0; transition: opacity 0.15s ease, transform 0.15s ease;
    pointer-events: none; text-align: center; white-space: nowrap;
  }
  .celebrate-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---- おみくじ ---- */
  .omikuji-rank { font-size: 32px; font-weight: 800; text-align: center; margin: 0 0 10px; }
  .omikuji-message { text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="industry-row">
      <label for="industrySelect">架電業種</label>
      <select id="industrySelect"></select>
      <button type="button" id="themeBtn" class="theme-btn" aria-label="デザイン変更">🎨</button>
    </div>
    <div class="total-row">
      <span class="label" id="userLabel">&nbsp;</span>
      <span class="value" id="dateLabel">&nbsp;</span>
    </div>
  </header>

  <div id="configWarning" class="config-warning hidden">
    Apps ScriptのURLが未設定です。config.js を編集してください（ローカルのカウントは可能です）。
  </div>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="mode-toggle">
      <button id="modeMinus" data-mode="subtract" class="minus">－ 取消</button>
      <button id="modePlus" data-mode="add" class="selected plus">＋ カウント</button>
      <button id="modeEdit" data-mode="edit" class="edit">✎ 編集</button>
    </div>
    <div class="status-row">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">同期済み</span>
    </div>
  </footer>
</div>

<div class="overlay" id="nameOverlay">
  <div class="card">
    <h2>はじめに、お名前を登録してください</h2>
    <p>同姓同名を避けるため、フルネームで入力してください。この端末に保存され、次回以降は入力不要です。</p>
    <div class="error hidden" id="nameError">お名前を入力してください</div>
    <input id="nameInput" type="text" placeholder="例：山田 太郎" autocomplete="name" />
    <button class="primary" id="nameSaveBtn">この内容で開始する</button>
  </div>
</div>

<div class="overlay hidden" id="themeOverlay">
  <div class="card">
    <h2>デザインを選ぶ</h2>
    <p>お好みの配色に変更できます。この端末にだけ保存されます。</p>
    <div class="theme-list" id="themeList"></div>
    <button class="primary" id="themeCloseBtn">閉じる</button>
  </div>
</div>

<div class="overlay hidden" id="omikujiOverlay">
  <div class="card">
    <div class="omikuji-rank" id="omikujiRank">吉</div>
    <p class="omikuji-message" id="omikujiMessage"></p>
    <button class="primary" id="omikujiCloseBtn">今日も頑張る！</button>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";

  // ---- KPI項目（表示順はアプリ仕様書の指定順と完全一致） ----
  var METRICS = [
    { key: "appo", label: "アポ獲得数" },
    { key: "callEnd", label: "終話数" },
    { key: "scheduleHearing", label: "日程ヒアリング数" },
    { key: "closing", label: "クロージング数" },
    { key: "testClosing", label: "テスクロ数" },
    { key: "purpose", label: "主旨説明数" },
    { key: "ownerMeeting", label: "オーナー対面数" },
    { key: "approach", label: "アプローチ数" },
    { key: "connect", label: "接続数" },
    { key: "call", label: "コール数" }
  ];

  // サーバー（スプレッドシートの「設定」シート）から取得できなかった場合のフォールバックのみに使用。
  // 業種の追加・変更は、通常はスプレッドシートの「設定」シートを編集するだけでよい（コード変更不要）。
  var DEFAULT_INDUSTRIES = [
    "美容", "飲食", "スクール", "フィットネス", "整体・治療院", "リラクゼーション",
    "宿泊", "建築・現場系", "修理・生活サービス", "自動車", "ペット", "小売", "レジャー", "その他"
  ];

  var LS = {
    NAME: "tc_name",
    INDUSTRY: "tc_industry",
    INDUSTRIES_CACHE: "tc_industries_cache",
    DAY: "tc_day",
    COUNTS: "tc_counts",
    STACKS: "tc_stacks",
    QUEUE: "tc_queue",
    THEME: "tc_theme",
    OMIKUJI_DAY: "tc_omikuji_day"
  };

  // ---- デザイン（テーマ）一覧。色はCSSカスタムプロパティとして適用する。 ----
  var THEMES = [
    { id: "default", name: "デフォルト", swatch: "#f3cf8f",
      vars: { "--bg": "#f4f4f5", "--tile-bg": "#ffffff", "--tile-border": "#e2e2e5", "--label-bg": "#f3cf8f", "--label-fg": "#3b2f1e", "--text": "#1c1c1e", "--muted": "#8a8a8e", "--accent": "#2f6fed", "--danger": "#e0533d", "--footer-bg": "#e9e9ec" } },
    { id: "dark", name: "ダーク", swatch: "#4a4458",
      vars: { "--bg": "#1c1c20", "--tile-bg": "#2a2a30", "--tile-border": "#3a3a42", "--label-bg": "#4a4458", "--label-fg": "#f0e8ff", "--text": "#f2f2f5", "--muted": "#9999a3", "--accent": "#6c8cff", "--danger": "#ff6b5e", "--footer-bg": "#242428" } },
    { id: "pop", name: "ポップ", swatch: "#ff9ecf",
      vars: { "--bg": "#fff4fb", "--tile-bg": "#ffffff", "--tile-border": "#ffd3ec", "--label-bg": "#ff9ecf", "--label-fg": "#5a1140", "--text": "#3a1030", "--muted": "#a872a0", "--accent": "#7b5bff", "--danger": "#ff4d6d", "--footer-bg": "#ffe3f3" } },
    { id: "sumi", name: "シック", swatch: "#4a4a52",
      vars: { "--bg": "#eceef0", "--tile-bg": "#ffffff", "--tile-border": "#d8dadd", "--label-bg": "#4a4a52", "--label-fg": "#ffffff", "--text": "#23252a", "--muted": "#767a82", "--accent": "#2f3b52", "--danger": "#b23a3a", "--footer-bg": "#dde0e3" } },
    { id: "pastel", name: "パステル", swatch: "#bfe3d0",
      vars: { "--bg": "#f6fbf8", "--tile-bg": "#ffffff", "--tile-border": "#dcefe3", "--label-bg": "#bfe3d0", "--label-fg": "#1f4a34", "--text": "#2b332f", "--muted": "#8ba297", "--accent": "#5ea8c9", "--danger": "#e38a8a", "--footer-bg": "#e4f3ea" } }
  ];

  // ---- おみくじ（1日1回・起動時に表示） ----
  var OMIKUJI = [
    { rank: "大吉", message: "今日は大型案件が舞い込むかも！積極的に攻めていこう。" },
    { rank: "大吉", message: "声のトーンが絶好調。アポが連発する予感。" },
    { rank: "中吉", message: "丁寧なヒアリングが実を結ぶ日。焦らずじっくり。" },
    { rank: "吉", message: "コツコツの積み重ねが後で効いてくる日。" },
    { rank: "吉", message: "笑顔で電話すれば、相手にもきっと伝わる。" },
    { rank: "小吉", message: "小さな成功を積み重ねよう。数をこなせば道は開ける。" },
    { rank: "末吉", message: "今日は準備の日。次に繋がるヒントが見つかるかも。" }
  ];

  var FLUSH_DEBOUNCE_MS = 400;
  var FLUSH_RETRY_MS = 6000;
  var BATCH_SIZE = 40;

  // ---- 日本時間ヘルパー ----
  var jstDateFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" });
  var jstHourFmt = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", hour12: false });

  function jstDateString(d) {
    // sv-SE ロケールは "yyyy-mm-dd" 形式を返すため採用
    return jstDateFmt.format(d || new Date());
  }
  function jstHour(d) {
    var s = jstHourFmt.format(d || new Date()).replace(/[^0-9]/g, "");
    var h = parseInt(s, 10);
    if (isNaN(h)) h = new Date().getHours();
    return h % 24;
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0, v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function zeroCounts() {
    var o = {};
    METRICS.forEach(function (m) { o[m.key] = 0; });
    return o;
  }
  function emptyStacks() {
    var o = {};
    METRICS.forEach(function (m) { o[m.key] = []; });
    return o;
  }

  // 業種一覧。初回はキャッシュ（前回サーバーから取得した一覧）→無ければ初期セットの順で使う。
  // アプリ起動時にサーバーへ問い合わせて最新化する（fetchIndustries）。
  var industries = loadJSON(LS.INDUSTRIES_CACHE, null) || DEFAULT_INDUSTRIES.slice();

  // ---- 状態 ----
  var state = {
    name: localStorage.getItem(LS.NAME) || "",
    industry: localStorage.getItem(LS.INDUSTRY) || industries[0],
    day: localStorage.getItem(LS.DAY) || jstDateString(),
    counts: loadJSON(LS.COUNTS, zeroCounts()),
    stacks: loadJSON(LS.STACKS, emptyStacks()),
    queue: loadJSON(LS.QUEUE, []),
    mode: "add",
    theme: localStorage.getItem(LS.THEME) || "default"
  };

  function persistCounters() {
    localStorage.setItem(LS.DAY, state.day);
    saveJSON(LS.COUNTS, state.counts);
    saveJSON(LS.STACKS, state.stacks);
    saveJSON(LS.QUEUE, state.queue);
  }

  function ensureDayRollover() {
    var today = jstDateString();
    if (today !== state.day) {
      state.day = today;
      state.counts = zeroCounts();
      state.stacks = emptyStacks();
      persistCounters();
      renderAll();
    }
  }

  // ---- DOM ----
  var gridEl = document.getElementById("grid");
  var industrySelect = document.getElementById("industrySelect");
  var userLabel = document.getElementById("userLabel");
  var dateLabel = document.getElementById("dateLabel");
  var modeMinus = document.getElementById("modeMinus");
  var modePlus = document.getElementById("modePlus");
  var modeEdit = document.getElementById("modeEdit");
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");
  var nameOverlay = document.getElementById("nameOverlay");
  var nameInput = document.getElementById("nameInput");
  var nameSaveBtn = document.getElementById("nameSaveBtn");
  var nameError = document.getElementById("nameError");
  var configWarning = document.getElementById("configWarning");
  var themeBtn = document.getElementById("themeBtn");
  var themeOverlay = document.getElementById("themeOverlay");
  var themeList = document.getElementById("themeList");
  var themeCloseBtn = document.getElementById("themeCloseBtn");
  var omikujiOverlay = document.getElementById("omikujiOverlay");
  var omikujiRank = document.getElementById("omikujiRank");
  var omikujiMessage = document.getElementById("omikujiMessage");
  var omikujiCloseBtn = document.getElementById("omikujiCloseBtn");

  function buildIndustryOptions() {
    industrySelect.innerHTML = "";
    industries.forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      industrySelect.appendChild(opt);
    });
    if (industries.indexOf(state.industry) === -1) {
      state.industry = industries[0];
      localStorage.setItem(LS.INDUSTRY, state.industry);
    }
    industrySelect.value = state.industry;
  }

  /**
   * 業種一覧をサーバー（スプレッドシートの「設定」シート）から取得して最新化する。
   * 管理者がシートに業種を追加・削除するだけで、この端末にも反映される（コード変更・再デプロイ不要）。
   * 失敗時・オフライン時は前回キャッシュ（または初期セット）のまま動作する。
   */
  function fetchIndustries() {
    if (!endpointReady()) return;
    fetch(window.APPS_SCRIPT_URL + "?action=industries", { method: "GET" })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json && json.ok && Array.isArray(json.industries) && json.industries.length) {
          industries = json.industries;
          saveJSON(LS.INDUSTRIES_CACHE, industries);
          buildIndustryOptions();
        }
      })
      .catch(function () {});
  }

  function buildTiles() {
    gridEl.innerHTML = "";
    METRICS.forEach(function (m) {
      var tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.metric = m.key;
      tile.innerHTML =
        '<div class="count" id="count-' + m.key + '">0</div>' +
        '<div class="metric-label">' + m.label + "</div>";
      tile.addEventListener("click", function () { onTileTap(m.key); });
      gridEl.appendChild(tile);
    });
  }

  function renderCounts() {
    METRICS.forEach(function (m) {
      var el = document.getElementById("count-" + m.key);
      if (el) el.textContent = String(state.counts[m.key] || 0);
    });
  }

  function renderHeader() {
    userLabel.textContent = state.name ? state.name + " さん" : "";
    dateLabel.textContent = formatDateLabel(state.day);
  }

  function formatDateLabel(dateStr) {
    var parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    return parts[0] + "/" + parts[1] + "/" + parts[2] + " 本日累計";
  }

  function renderMode() {
    modePlus.classList.toggle("selected", state.mode === "add");
    modeMinus.classList.toggle("selected", state.mode === "subtract");
    modeEdit.classList.toggle("selected", state.mode === "edit");
  }

  function renderStatus() {
    var pending = state.queue.length;
    if (!navigator.onLine) {
      statusDot.className = "status-dot offline";
      statusText.textContent = "オフライン（未送信 " + pending + " 件）";
    } else if (pending > 0) {
      statusDot.className = "status-dot pending";
      statusText.textContent = "送信中…（未送信 " + pending + " 件）";
    } else {
      statusDot.className = "status-dot";
      statusText.textContent = "同期済み";
    }
  }

  function renderAll() {
    renderHeader();
    renderCounts();
    renderMode();
    renderStatus();
  }

  /**
   * 1回分の加算/減算を実際に適用する（スタック操作・イベントキュー追加まで）。
   * 通常のタップ（1回）にも、編集モードの一括変更（複数回ループ）にも共通で使う。
   * 呼び出し側で persistCounters/renderCounts/renderStatus/scheduleFlush をまとめて呼ぶこと。
   */
  function applyStep(metricKey, stepDelta, nowIso) {
    if (stepDelta > 0) {
      state.counts[metricKey] = (state.counts[metricKey] || 0) + 1;
      var ctx = { industry: state.industry, occurredAt: nowIso };
      state.stacks[metricKey].push(ctx);
      enqueueEvent({
        clientEventId: uuid(),
        name: state.name,
        industry: ctx.industry,
        metricKey: metricKey,
        delta: 1,
        occurredAt: ctx.occurredAt
      });
    } else {
      if ((state.counts[metricKey] || 0) <= 0) return; // 0未満にはしない
      var popped = state.stacks[metricKey].pop();
      var useIndustry = popped ? popped.industry : state.industry;
      var useOccurredAt = popped ? popped.occurredAt : nowIso;
      state.counts[metricKey] = Math.max(0, (state.counts[metricKey] || 0) - 1);
      enqueueEvent({
        clientEventId: uuid(),
        name: state.name,
        industry: useIndustry,
        metricKey: metricKey,
        delta: -1,
        occurredAt: useOccurredAt
      });
    }
  }

  function onTileTap(metricKey) {
    ensureDayRollover();
    if (state.mode === "edit") { onTileEdit(metricKey); return; }

    var nowIso = new Date().toISOString();
    var wasAdd = state.mode === "add";
    applyStep(metricKey, wasAdd ? 1 : -1, nowIso);
    if (wasAdd && metricKey === "appo") celebrateAppo();

    persistCounters();
    renderCounts();
    renderStatus();
    scheduleFlush();
  }

  /**
   * 編集モード：タイルをタップすると現在の件数を元に新しい件数を入力できる。
   * 差分（増えた分/減った分）を1件ずつの加算・減算として処理するため、
   * 既存の業種・時間帯の紐づけ（取消時の正しい再帰属）やサーバー側の検証は一切変更不要。
   */
  function onTileEdit(metricKey) {
    var metric = null;
    for (var i = 0; i < METRICS.length; i++) {
      if (METRICS[i].key === metricKey) { metric = METRICS[i]; break; }
    }
    var label = metric ? metric.label : metricKey;
    var current = state.counts[metricKey] || 0;
    var input = window.prompt(label + "の本日の件数を入力してください（現在 " + current + " 件）", String(current));
    if (input === null) return; // キャンセル

    var trimmed = input.trim();
    if (!/^\d+$/.test(trimmed)) {
      window.alert("0以上の整数を入力してください");
      return;
    }
    var next = parseInt(trimmed, 10);
    if (next > 9999) {
      window.alert("9999件以下で入力してください");
      return;
    }

    var diff = next - current;
    if (diff === 0) return;

    var nowIso = new Date().toISOString();
    var steps = Math.abs(diff);
    var stepDelta = diff > 0 ? 1 : -1;
    for (var s = 0; s < steps; s++) {
      applyStep(metricKey, stepDelta, nowIso);
    }
    if (diff > 0 && metricKey === "appo") celebrateAppo();

    persistCounters();
    renderCounts();
    renderStatus();
    scheduleFlush();
  }

  function enqueueEvent(ev) {
    state.queue.push(ev);
  }

  // ---- デザイン（テーマ）----
  function applyTheme(themeId) {
    var theme = null;
    for (var i = 0; i < THEMES.length; i++) {
      if (THEMES[i].id === themeId) { theme = THEMES[i]; break; }
    }
    if (!theme) theme = THEMES[0];
    var root = document.documentElement.style;
    Object.keys(theme.vars).forEach(function (key) { root.setProperty(key, theme.vars[key]); });
    state.theme = theme.id;
    localStorage.setItem(LS.THEME, theme.id);
  }

  function buildThemeList() {
    themeList.innerHTML = "";
    THEMES.forEach(function (t) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "theme-option" + (state.theme === t.id ? " selected" : "");
      btn.innerHTML = '<span class="theme-swatch" style="background:' + t.swatch + '"></span><span>' + t.name + "</span>";
      btn.addEventListener("click", function () {
        applyTheme(t.id);
        buildThemeList();
      });
      themeList.appendChild(btn);
    });
  }

  // ---- アポ獲得時の祝賀演出 ----
  var CONFETTI_EMOJI = ["🎉", "✨", "🎊", "⭐", "🥳"];
  var CELEBRATE_MESSAGES = ["🎉 アポ獲得！", "やった、ナイスアポ！", "お見事！🎉", "この調子！"];
  function celebrateAppo() {
    for (var i = 0; i < 14; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
      piece.style.left = (Math.random() * 100) + "vw";
      piece.style.fontSize = (16 + Math.random() * 14) + "px";
      piece.style.animationDelay = (Math.random() * 0.25) + "s";
      document.body.appendChild(piece);
      (function (el) { setTimeout(function () { el.remove(); }, 1500); })(piece);
    }
    var toast = document.createElement("div");
    toast.className = "celebrate-toast";
    toast.textContent = CELEBRATE_MESSAGES[Math.floor(Math.random() * CELEBRATE_MESSAGES.length)];
    document.body.appendChild(toast);
    requestAnimationFrame(function () { toast.classList.add("show"); });
    setTimeout(function () {
      toast.classList.remove("show");
      setTimeout(function () { toast.remove(); }, 200);
    }, 1200);
  }

  // ---- おみくじ（1日1回、アプリを開いたときに表示） ----
  function maybeShowOmikuji() {
    var today = jstDateString();
    if (localStorage.getItem(LS.OMIKUJI_DAY) === today) return;
    var pick = OMIKUJI[Math.floor(Math.random() * OMIKUJI.length)];
    omikujiRank.textContent = pick.rank;
    omikujiMessage.textContent = pick.message;
    omikujiOverlay.classList.remove("hidden");
    localStorage.setItem(LS.OMIKUJI_DAY, today);
  }

  // ---- サーバー送信 ----
  var flushTimer = null;
  var flushing = false;

  function scheduleFlush() {
    if (flushTimer) clearTimeout(flushTimer);
    flushTimer = setTimeout(flushQueue, FLUSH_DEBOUNCE_MS);
  }

  function endpointReady() {
    return typeof window.APPS_SCRIPT_URL === "string" &&
      /^https?:\/\//.test(window.APPS_SCRIPT_URL) &&
      window.APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === -1;
  }

  function flushQueue() {
    configWarning.classList.toggle("hidden", endpointReady());
    if (flushing) return;
    if (!state.queue.length) { renderStatus(); return; }
    if (!endpointReady() || !navigator.onLine) {
      renderStatus();
      flushTimer = setTimeout(flushQueue, FLUSH_RETRY_MS);
      return;
    }

    flushing = true;
    var batch = state.queue.slice(0, BATCH_SIZE);
    renderStatus();

    fetch(window.APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // CORSプリフライト回避のため text/plain を使用
      body: JSON.stringify({ events: batch })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        flushing = false;
        if (json && json.ok) {
          var sentIds = {};
          batch.forEach(function (ev) { sentIds[ev.clientEventId] = true; });
          state.queue = state.queue.filter(function (ev) { return !sentIds[ev.clientEventId]; });
          persistCounters();
          renderStatus();
          if (state.queue.length) scheduleFlush();
        } else {
          flushTimer = setTimeout(flushQueue, FLUSH_RETRY_MS);
        }
      })
      .catch(function () {
        flushing = false;
        flushTimer = setTimeout(flushQueue, FLUSH_RETRY_MS);
      });
  }

  // ---- イベント ----
  industrySelect.addEventListener("change", function () {
    state.industry = industrySelect.value;
    localStorage.setItem(LS.INDUSTRY, state.industry);
  });

  modePlus.addEventListener("click", function () { state.mode = "add"; renderMode(); });
  modeMinus.addEventListener("click", function () { state.mode = "subtract"; renderMode(); });
  modeEdit.addEventListener("click", function () { state.mode = "edit"; renderMode(); });

  themeBtn.addEventListener("click", function () {
    buildThemeList();
    themeOverlay.classList.remove("hidden");
  });
  themeCloseBtn.addEventListener("click", function () { themeOverlay.classList.add("hidden"); });
  omikujiCloseBtn.addEventListener("click", function () { omikujiOverlay.classList.add("hidden"); });

  window.addEventListener("online", function () { renderStatus(); scheduleFlush(); });
  window.addEventListener("offline", renderStatus);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      ensureDayRollover();
      scheduleFlush();
      fetchIndustries();
    }
  });
  setInterval(function () { ensureDayRollover(); scheduleFlush(); }, 15000);

  function saveName() {
    var v = nameInput.value.trim();
    if (!v) { nameError.classList.remove("hidden"); return; }
    nameError.classList.add("hidden");
    state.name = v;
    localStorage.setItem(LS.NAME, v);
    nameOverlay.classList.add("hidden");
    renderHeader();
    maybeShowOmikuji();
  }
  nameSaveBtn.addEventListener("click", saveName);
  nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") saveName(); });

  // ---- 初期化 ----
  function init() {
    applyTheme(state.theme);
    buildIndustryOptions();
    buildTiles();
    ensureDayRollover();
    renderAll();
    configWarning.classList.toggle("hidden", endpointReady());

    if (!state.name) {
      nameOverlay.classList.remove("hidden");
      setTimeout(function () { nameInput.focus(); }, 200);
    } else {
      nameOverlay.classList.add("hidden");
      maybeShowOmikuji();
    }

    if (state.queue.length) scheduleFlush();
    fetchIndustries();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  }

  init();
})();
</script>
</body>
